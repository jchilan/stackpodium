<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StackPodium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a parts catalogue. Left rail of "what do you want to build", right column of ranked podiums. */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --ink:#131c33; --muted:#56607a; --line:#d5dae6;
  --accent:#2a45e8; --accent-ink:#ffffff; --gold:#f2a900; --tint:#e6eaff;
  --display:"Bricolage Grotesque","Arial Narrow",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,"PingFang SC","Microsoft YaHei",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1322; --surface:#171e33; --ink:#eef1fa; --muted:#a3acc4; --line:#2b3552;
    --accent:#8b9cff; --accent-ink:#0e1322; --gold:#ffc53d; --tint:#1f2a4d;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1322; --surface:#171e33; --ink:#eef1fa; --muted:#a3acc4; --line:#2b3552;
  --accent:#8b9cff; --accent-ink:#0e1322; --gold:#ffc53d; --tint:#1f2a4d;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
a{color:var(--accent)}
a:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header.top{border-bottom:1px solid var(--line);background:var(--surface)}
.top .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding-top:14px;padding-bottom:14px}
.brand{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.brand span{color:var(--accent)}
.top nav{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.92rem}
.top nav a{color:var(--muted);text-decoration:none}
.top nav a:hover{color:var(--ink);text-decoration:underline}
.langs{display:flex;gap:4px;padding:3px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.langs button{font:inherit;font-size:.85rem;padding:4px 10px;border:0;border-radius:5px;background:transparent;color:var(--muted);cursor:pointer}
.langs button:hover{color:var(--ink)}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.intro{padding:40px 0 28px}
.intro h1{font-family:var(--display);font-weight:800;font-size:clamp(2rem,5.2vw,3.3rem);line-height:1.06;letter-spacing:-.025em;margin:0 0 14px;max-width:19ch;text-wrap:balance}
.intro p{max-width:62ch;margin:0;color:var(--muted);font-size:1.08rem}
.status{display:inline-flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:18px;padding:6px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-size:.85rem;color:var(--muted)}
.status b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:32px;align-items:start;padding-bottom:48px}
.rail{position:sticky;top:16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.rail h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:2px 6px 10px;font-weight:600}
.rail ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.rail a{display:flex;gap:10px;padding:7px 8px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:.93rem;line-height:1.3}
.rail a:hover{background:var(--tint)}
.rail a i{font-family:var(--mono);font-style:normal;color:var(--muted);font-size:.8rem;padding-top:2px}
.cases{display:flex;flex-direction:column;gap:22px}
.case{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;scroll-margin-top:16px}
.case .num{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.case h2{font-family:var(--display);font-weight:600;font-size:1.45rem;line-height:1.2;margin:2px 0 6px;letter-spacing:-.01em;text-wrap:balance}
.case .who{margin:0 0 16px;color:var(--muted);max-width:65ch}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.rank li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:8px}
.rank li.first{border-color:var(--accent);background:var(--tint)}
.pos{font-family:var(--mono);font-size:1.3rem;line-height:1.2;color:var(--muted)}
.first .pos{color:var(--accent)}
.tool{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.tool a{font-weight:600;font-size:1.05rem;color:var(--ink)}
.price{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.why{margin:3px 0 0;font-size:.95rem;max-width:65ch}
.extra{margin:14px 0 0;padding-top:12px;border-top:1px dashed var(--line);font-size:.92rem;color:var(--muted);max-width:68ch}
.extra b{color:var(--ink);font-weight:600}
section.block{padding:44px 0;border-top:1px solid var(--line)}
section.block h2{font-family:var(--display);font-weight:800;font-size:1.8rem;letter-spacing:-.02em;margin:0 0 8px}
section.block>.wrap>p{max-width:65ch;color:var(--muted);margin:0 0 22px}
.criteria{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;list-style:none;margin:0;padding:0}
.criteria li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.criteria .w{font-family:var(--mono);font-size:1.5rem;color:var(--accent);display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.criteria h3{margin:8px 0 4px;font-size:1rem}
.criteria p{margin:0;font-size:.9rem;color:var(--muted)}
.news{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.news li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;padding:14px 18px;border-top:1px solid var(--line)}
.news li:first-child{border-top:0}
.news time{font-family:var(--mono);font-size:.82rem;color:var(--muted);padding-top:3px}
.news h3{margin:0 0 2px;font-size:1rem}
.news p{margin:0;font-size:.93rem;color:var(--muted);max-width:65ch}
.news .src{font-size:.82rem}
footer{border-top:1px solid var(--line);padding:26px 0 40px;font-size:.88rem;color:var(--muted)}
footer p{max-width:70ch;margin:0 0 8px}
@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .rail{position:static}
  .rail ol{flex-direction:row;flex-wrap:wrap}
  .rail a i{display:none}
  .rail a{border:1px solid var(--line);padding:6px 10px}
  .news li{grid-template-columns:minmax(0,1fr);gap:2px}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#top">Stack<span>Podium</span></a>
    <nav aria-label="Sections">
      <a href="#cases" data-t="nav1"></a>
      <a href="#method" data-t="nav2"></a>
      <a href="#changes" data-t="nav3"></a>
    </nav>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" id="lang-en" data-lang="0">English</button>
      <button type="button" id="lang-pt" data-lang="1">Português</button>
      <button type="button" id="lang-es" data-lang="2">Español</button>
      <button type="button" id="lang-zh" data-lang="3">中文</button>
    </div>
  </div>
</header>

<main id="top">
  <div class="wrap intro">
    <h1 data-t="h1"></h1>
    <p data-t="intro"></p>
    <div class="status"><b>v0.3</b> <span data-t="status"></span></div>
  </div>

  <div class="wrap layout" id="cases">
    <aside class="rail">
      <h2 data-t="rail"></h2>
      <ol id="rail"></ol>
    </aside>
    <div class="cases" id="caselist"></div>
  </div>

  <section class="block" id="method">
    <div class="wrap">
      <h2 data-t="nav2"></h2>
      <p data-t="method"></p>
      <ul class="criteria" id="criteria"></ul>
    </div>
  </section>

  <section class="block" id="changes">
    <div class="wrap">
      <h2 data-t="newsh"></h2>
      <p data-t="newsp"></p>
      <ul class="news" id="news"></ul>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <p data-t="foot1"></p>
    <p data-t="foot2"></p>
  </div>
</footer>

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function pad(n){return n<10?"0"+n:""+n;}
function render(l){
  document.documentElement.lang=HTMLLANG[l];
  var els=document.querySelectorAll("[data-t]");
  for(var i=0;i<els.length;i++){els[i].textContent=UI[els[i].getAttribute("data-t")][l];}
  var bs=document.querySelectorAll(".langs button");
  for(var b=0;b<bs.length;b++){bs[b].setAttribute("aria-pressed",String(+bs[b].getAttribute("data-lang")===l));}
  var rail="",cases="";
  CASES.forEach(function(c,i){
    rail+='<li><a href="#'+c.id+'"><i>'+pad(i+1)+'</i>'+esc(c.t[l])+'</a></li>';
    var li="";
    c.r.forEach(function(r,j){
      var t=T[r[0]], name=typeof t[0]==="string"?t[0]:t[0][l];
      li+='<li'+(j===0?' class="first"':'')+'><span class="pos">'+(j+1)+'</span><div><div class="tool"><a href="'+esc(t[1])+'">'+esc(name)+'</a><span class="price">'+esc(price(t[2],l))+'</span></div><p class="why">'+esc(r[1][l])+'</p></div></li>';
    });
    cases+='<article class="case" id="'+c.id+'"><span class="num">'+esc(UI["case"][l])+' '+pad(i+1)+'</span><h2>'+esc(c.t[l])+'</h2><p class="who">'+esc(c.who[l])+'</p><ol class="rank">'+li+'</ol><p class="extra">'+c.x[l]+'</p></article>';
  });
  document.getElementById("rail").innerHTML=rail;
  document.getElementById("caselist").innerHTML=cases;
  var cr="";
  CRIT.forEach(function(c){cr+='<li><span class="w">'+c[0]+'</span><h3>'+esc(c[1][l])+'</h3><p>'+esc(c[2][l])+'</p></li>';});
  document.getElementById("criteria").innerHTML=cr;
  var n="";
  NEWS.forEach(function(x){n+='<li><time>'+esc(x[0][l])+'</time><div><h3>'+esc(x[1][l])+'</h3><p>'+esc(x[2][l])+' <a class="src" href="'+esc(x[3])+'">'+esc(UI.src[l])+': '+esc(x[4])+'</a></p></div></li>';});
  document.getElementById("news").innerHTML=n;
}
